name: Release

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name (e.g. v1.0.8)'
        required: false
        default: ''

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute and Increment Version
        id: version_step
        run: |
          RUN_NUM="${{ github.run_number }}"
          CALC_CODE=$((100 + RUN_NUM))
          
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${{ github.ref_name }}"
            VER="${TAG#v}"
          elif [ -n "${{ inputs.tag_name }}" ]; then
            TAG="${{ inputs.tag_name }}"
            VER="${TAG#v}"
          else
            VER="1.0.${CALC_CODE}"
            TAG="v${VER}"
          fi
          
          echo "APP_VERSION_CODE=${CALC_CODE}" >> $GITHUB_ENV
          echo "APP_VERSION_NAME=${VER}" >> $GITHUB_ENV
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "version=${VER}" >> $GITHUB_OUTPUT
          echo "version_code=${CALC_CODE}" >> $GITHUB_OUTPUT
          echo "Target Tag: ${TAG} (Version Name: ${VER}, Version Code: ${CALC_CODE})"

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'microsoft'

      - name: Setup Gradle Build Cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Setup Android Release Keystore
        run: |
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "Decoding permanent release.keystore from GitHub Secret..."
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > release.keystore
          elif [ -f release.keystore ]; then
            echo "Using existing release.keystore from workspace..."
          else
            echo "Release signing credentials are not configured."
            exit 1
          fi
          echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/release.keystore" >> $GITHUB_ENV
          if [ ! -f debug.keystore ]; then
            cp release.keystore debug.keystore || true
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --build-cache --parallel -Dorg.gradle.jvmargs="-Xmx4096m -XX:+UseParallelGC" --stacktrace

      - name: Prepare Release Assets
        id: prepare_asset
        run: |
          TAG="${{ steps.version_step.outputs.tag }}"
          VER="${{ steps.version_step.outputs.version }}"
          mkdir -p release-assets
          APK_NAME="Feather-Browser-${TAG}.apk"
          FOUND_APK=$(find app/build/outputs/apk/release -name "*.apk" 2>/dev/null | head -n 1)
          if [ -z "$FOUND_APK" ]; then
            FOUND_APK=$(find . -name "*release*.apk" 2>/dev/null | head -n 1)
          fi
          if [ -n "$FOUND_APK" ] && [ -f "$FOUND_APK" ]; then
            cp "$FOUND_APK" "release-assets/${APK_NAME}"
          elif [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk "release-assets/${APK_NAME}"
          else
            echo "Error: Release APK not found!"
            find . -name "*.apk"
            exit 1
          fi
          cd release-assets
          sha256sum "${APK_NAME}" > "${APK_NAME}.sha256"
          echo "apk_name=${APK_NAME}" >> $GITHUB_OUTPUT

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prepare_asset.outputs.apk_name }}
          path: release-assets/*
          retention-days: 90

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version_step.outputs.tag }}"
          VER="${{ steps.version_step.outputs.version }}"
          
          echo "Publishing release for ${TAG}..."
          
          # Delete existing release & tag on GitHub if re-running or updating
          gh release delete "${TAG}" --yes --cleanup-tag 2>/dev/null || true
          
          # Create release and upload all assets with GitHub CLI
          gh release create "${TAG}" release-assets/* \
            --title "Feather Browser ${TAG}" \
            --generate-notes \
            --latest \
            --target "${{ github.sha }}"

