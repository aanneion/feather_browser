name: Release

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name (e.g. v1.0.8)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract Version
        id: version_step
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${{ github.ref_name }}"
            VER="${TAG#v}"
          elif [ -n "${{ inputs.tag_name }}" ]; then
            TAG="${{ inputs.tag_name }}"
            VER="${TAG#v}"
          else
            # Extract versionName from app/build.gradle.kts
            VER=$(grep 'versionName = ' app/build.gradle.kts | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
            TAG="v${VER}"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "version=${VER}" >> $GITHUB_OUTPUT
          echo "Target Tag: ${TAG} (Version: ${VER})"

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'microsoft'
          cache: gradle

      - name: Setup Android Keystore for Release
        run: |
          if [ ! -f debug.keystore ]; then
            echo "Generating build debug.keystore for signing..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon -Dkotlin.compiler.execution.strategy=daemon --stacktrace

      - name: Prepare Release Assets
        id: prepare_asset
        run: |
          TAG="${{ steps.version_step.outputs.tag }}"
          VER="${{ steps.version_step.outputs.version }}"
          mkdir -p release-assets
          APK_NAME="Feather-Browser-${TAG}.apk"
          cp app/build/outputs/apk/release/app-release.apk "release-assets/${APK_NAME}"
          cp app/build/outputs/apk/release/app-release.apk "release-assets/Feather-Browser-Release.apk"
          cd release-assets
          sha256sum "${APK_NAME}" > "${APK_NAME}.sha256"
          sha256sum "Feather-Browser-Release.apk" > "Feather-Browser-Release.apk.sha256"
          echo "apk_name=${APK_NAME}" >> $GITHUB_OUTPUT

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prepare_asset.outputs.apk_name }}
          path: release-assets/*
          retention-days: 90

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version_step.outputs.tag }}"
          VER="${{ steps.version_step.outputs.version }}"
          
          echo "Publishing release for ${TAG}..."
          
          # Delete existing release & tag on GitHub if re-running or updating
          gh release delete "${TAG}" --yes --cleanup-tag 2>/dev/null || true
          
          # Create release and upload all assets with GitHub CLI
          gh release create "${TAG}" release-assets/* \
            --title "Feather Browser ${TAG}" \
            --generate-notes \
            --latest \
            --target "${{ github.sha }}"


